@if (room$ | async; as room) {
  <div class="bg-white w-2xl h-[90dvh] rounded-xl shadow-xl flex flex-col">
    <div class="flex justify-between">
      <div>
        <div class="flex items-center">
          <button
            class="text-2xl text-gray-400 px-4 border-r-2 border-r-gray-100 cursor-pointer"
            (click)="goRoomList()"
          >
            <
          </button>
          <div class="border-b-2 border-b-gray-100 p-4">
            <span>{{ room.name }}</span>
          </div>
        </div>
      </div>
      <div class="p-4 cursor-pointer"><span (click)="openConfig()">설정</span></div>
    </div>
    <div class="flex-1 flex flex-col min-h-0 inset-shadow-sm">
      <div class="flex-1 overflow-auto p-4">
        @if (chatList$ | async; as chatList) {
          @for (chat of chatList; track chat.id) {
            <div
              class="w-full flex mb-2"
              [class.justify-end]="isMyChat(chat)"
              [class.justify-start]="!isMyChat(chat)"
            >
              <div
                class="rounded-md shadow-md p-2 w-fit max-w-1/2"
                [class.bg-blue-50]="isMyChat(chat)"
                [class.bg-blue-300]="!isMyChat(chat)"
              >
                {{ chat.content }}
              </div>
            </div>
          }
        }
      </div>
      <form [formGroup]="chatForm" (ngSubmit)="onChatSubmit()" for="chatSubmit">
        <div class="h-16 bg-blue-50 flex items-center p-2">
          <textarea
            class="bg-white rounded-md shadow-md flex-1 mr-2 h-10 resize-none focus:outline-2 focus:outline-blue-200 p-2"
            formControlName="content"
          ></textarea>
          <input
            id="chatSubmit"
            type="submit"
            value="보내기"
            class="bg-blue-400 rounded-md text-white w-16 h-10 cursor-pointer"
          />
        </div>
      </form>
    </div>
  </div>
}
@if (isOpenConfig) {
  <form [formGroup]="roomForm" (ngSubmit)="onRoomSubmit()" for="roomSubmit">
    <div class="fixed top-0 left-0 w-full h-full bg-gray-950/50 flex justify-center items-center">
      <div class="flex flex-col bg-white w-xl h-150 rounded-xl shadow-xl overflow-hidden">
        <div class="flex justify-between border-b-2 border-b-gray-100 p-4">
          <span>시스템 설정</span>
          <div class="cursor-pointer" (click)="closeConfig()">X</div>
        </div>
        <div class="flex-1 min-h-0 overflow-auto">
          <div class="p-4">
            <div class="flex flex-col mb-2">
              <label for="name" class="mb-1">방이름</label>
              <input
                type="text"
                class="rounded-md border-2 border-gray-200 w-full p-2"
                formControlName="name"
              />
            </div>
            <div class="flex flex-col mb-2">
              <label for="aiSystem" class="mb-1">성격 명령어</label>
              <textarea
                id="aiSystem"
                class="rounded-md border-2 border-gray-200 w-full h-100 resize-none focus:outline-none p-2"
                formControlName="aiSystem"
              ></textarea>
            </div>
            <div class="flex flex-col mt-4">
              <input
                id="roomSubmit"
                type="submit"
                value="저장"
                class="bg-blue-400 rounded-md text-white w-full h-10 cursor-pointer"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
}
