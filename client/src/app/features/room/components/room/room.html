@if (room$ | async; as room) {
  <div
    class="bg-white w-[90dvw] max-w-2xl h-[90dvh] flex flex-col rounded-xl shadow-xl overflow-hidden"
  >
    <div class="flex justify-between p-4 max-sm:p-3 max-sm:text-sm">
      <div class="flex items-center">
        <button class="text-gray-400 mr-4 max-sm:mr-3 cursor-pointer" (click)="goRoomList()">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="">
          <span>{{ room.name }}</span>
        </div>
      </div>
      <div class="text-xl max-sm:text-sm cursor-pointer">
        <span (click)="openConfig()"><i class="fa-solid fa-sliders"></i></span>
      </div>
    </div>
    <div class="flex-1 flex flex-col min-h-0 inset-shadow-sm">
      <div #scrollContainer class="flex-1 overflow-auto p-4 max-sm:p-3 max-sm:text-xs">
        @if (chatList$ | async; as chatList) {
          @for (chat of chatList; track chat.id) {
            <div class="mb-2">
              <div
                class="w-full flex mb-1"
                [class.justify-end]="isMyChat(chat)"
                [class.justify-start]="!isMyChat(chat)"
              >
                <div
                  class="rounded-md shadow-md p-2 w-fit max-w-1/2 prose"
                  [class.bg-blue-50]="isMyChat(chat)"
                  [class.bg-blue-300]="!isMyChat(chat)"
                >
                  <markdown
                    class="prose prose-sm max-sm:text-xs text-black"
                    [data]="chat.content"
                  ></markdown>
                </div>
              </div>
              <div
                class="flex text-xs font-thin max-sm:text-[10px] text-gray-500"
                [class.justify-end]="isMyChat(chat)"
                [class.justify-start]="!isMyChat(chat)"
              >
                {{ chat.dateCreated }}
              </div>
            </div>
          }
        }
      </div>
      <form [formGroup]="chatForm" (ngSubmit)="onChatSubmit()" for="chatSubmit">
        <div class="h-24 bg-blue-50 flex items-center p-2 max-sm:text-xs">
          <textarea
            class="bg-white rounded-md shadow-md flex-1 mr-2 h-18 resize-none focus:outline-2 focus:outline-blue-200 p-2"
            formControlName="content"
          ></textarea>
          <button
            id="chatSubmit"
            type="submit"
            class="bg-[#6391ee] rounded-md text-white w-16 max-sm:w-14 h-10 max-sm:h-8 cursor-pointer"
          >
            <i class="fa-regular fa-paper-plane"></i>
          </button>
        </div>
      </form>
    </div>
  </div>
}
@if (isOpenConfig) {
  <form [formGroup]="roomForm" (ngSubmit)="onRoomSubmit()" for="roomSubmit">
    <div class="fixed top-0 left-0 w-full h-full bg-gray-950/50 flex justify-center items-center">
      <div class="flex flex-col bg-white w-xl rounded-xl shadow-xl overflow-hidden">
        <div
          class="flex justify-between border-b-2 border-b-gray-100 p-4 max-sm:p-3 max-sm:text-sm"
        >
          <span class="my-auto">시스템 설정</span>
          <div class="cursor-pointer" (click)="closeConfig()">
            <i class="fa-solid fa-xmark"></i>
          </div>
        </div>
        <div class="flex-1 min-h-0 overflow-auto">
          <div class="p-4">
            <div class="flex flex-col mb-2">
              <label class="mb-1 max-sm:text-sm">방이름</label>
              <input
                type="text"
                class="rounded-md border-2 w-full p-1 max-sm:text-sm"
                [ngClass]="{ 'border-gray-200': isNameValid, 'border-red-300': !isNameValid }"
                formControlName="name"
              />
            </div>
            <div class="flex flex-col mb-2">
              <label for="aiSystem" class="mb-1 max-sm:text-sm">성격 명령어</label>
              <textarea
                id="aiSystem"
                class="rounded-md border-2 border-gray-200 w-full h-80 resize-none focus:outline-none p-2"
                formControlName="aiSystem"
              ></textarea>
            </div>
            <div class="flex flex-col mt-4">
              <button
                id="roomSubmit"
                type="submit"
                class="bg-[#6391ee] rounded-md text-white w-full h-10 max-sm:h-8 max-sm:text-sm cursor-pointer"
              >
                <i class="fa-solid fa-arrow-up-from-bracket"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
}
