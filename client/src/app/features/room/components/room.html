@if (room$ | async; as room) {
  <div class="bg-white w-xl h-200 rounded-xl shadow-xl overflow-hidden flex flex-col">
    <div class="flex">
      <div class="flex items-center">
        <button class="text-2xl text-gray-400 px-4 border-r-2 border-r-gray-100"></button>
      </div>
      <div class="border-b-2 border-b-gray-100 p-4">
        <span>{{ room.name }}</span>
      </div>
    </div>
    <div class="flex-1 flex flex-col min-h-0 inset-shadow-sm">
      <div class="flex-1 overflow-auto p-4">
        @if (chatList$ | async; as chatList) {
          @for (chat of chatList; track chat.id) {
            <div
              class="w-full flex mb-2"
              [class.justify-end]="isMyChat(chat)"
              [class.justify-start]="!isMyChat(chat)"
            >
              <div
                class="rounded-md shadow-md p-2 w-fit max-w-2/5"
                [class.bg-blue-50]="isMyChat(chat)"
                [class.bg-blue-300]="!isMyChat(chat)"
              >
                {{ chat.content }}
              </div>
            </div>
          }
        }
      </div>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="h-16 bg-blue-50 flex items-center p-2">
          <textarea
            class="bg-white rounded-md shadow-md flex-1 mr-2 h-10 resize-none focus:outline-2 focus:outline-blue-200 p-2"
            formControlName="content"
          ></textarea>
          <input type="submit" value="보내기" class="bg-blue-400 rounded-md text-white w-16 h-10" />
        </div>
      </form>
    </div>
  </div>
}
