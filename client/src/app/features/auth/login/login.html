<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="min-w-96 h-full flex items-center justify-center"
>
  <div class="w-96">
    <div class="w-full">
      <label for="email">이메일 </label>
      <input id="email" type="text" formControlName="email" />
    </div>
    <div>
      <label for="password">비밀번호 </label>
      <input id="password" type="passwordpassword" formControlName="password" />
    </div>
    <input type="submit" value="제출" />
  </div>
</form>
